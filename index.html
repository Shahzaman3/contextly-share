<body><main><span class="eyebrow">PRIVATE CONTEXTLY THREAD</span><h1 id="heading">Opening thread…</h1><p id="status">Decrypting in this browser.</p><section id="viewer" hidden><label>Thread name<input id="title" maxlength="200"></label><label>Thread content<textarea id="content" maxlength="500000"></textarea></label><div class="extension-note" id="extension-note">Install or reload Contextly to save and inject this editable thread directly.</div><div class="actions" id="extension-actions" hidden><button class="accent" id="save">Save to Contextly</button><button id="chatgpt">Inject into ChatGPT</button><button id="claude">Inject into Claude</button></div><div class="actions"><button class="secondary" id="copy">Copy</button><button class="secondary" id="download">Download</button></div></section><p id="success"></p><p id="error"></p><small>The thread is decrypted only in this browser. Edits stay local unless you save them to Contextly.</small></main>
<script>
const api='https://izghcfsrkvtxopsfuyic.supabase.co/functions/v1/thread-share',heading=document.querySelector('#heading'),status=document.querySelector('#status'),viewer=document.querySelector('#viewer'),title=document.querySelector('#title'),content=document.querySelector('#content'),extensionNote=document.querySelector('#extension-note'),extensionActions=document.querySelector('#extension-actions'),success=document.querySelector('#success'),error=document.querySelector('#error');
const shareId=new URL(location.href).searchParams.get('id');let extensionReady=false;
const decode=value=>{const normalized=value.replace(/-/g,'+').replace(/_/g,'/');const binary=atob(normalized.padEnd(Math.ceil(normalized.length/4)*4,'='));return Uint8Array.from(binary,c=>c.charCodeAt(0))};
const current=()=>({title:title.value.trim(),content:content.value});
const setMessage=(message,isError=false)=>{success.textContent=isError?'':message;error.textContent=isError?message:''};
window.addEventListener('message',event=>{if(event.source!==window||event.origin!==location.origin)return;if(event.data?.type==='CONTEXTLY_EXTENSION_READY'){extensionReady=true;extensionActions.hidden=false;extensionNote.textContent='Contextly detected. Save this thread or inject the edited version directly.'}});
window.postMessage({type:'CONTEXTLY_VIEWER_READY'},location.origin);
function askExtension(destination){return new Promise((resolve,reject)=>{if(!extensionReady)return reject(new Error('Contextly is not available on this page. Reload the extension and this link.'));const requestId=crypto.randomUUID(),timeout=setTimeout(()=>{window.removeEventListener('message',listener);reject(new Error('Contextly did not respond. Reload the extension and try again.'))},6000);function listener(event){if(event.source!==window||event.origin!==location.origin||event.data?.type!=='CONTEXTLY_RECEIVER_RESPONSE'||event.data.requestId!==requestId)return;clearTimeout(timeout);window.removeEventListener('message',listener);event.data.ok?resolve(event.data):reject(new Error(event.data.error||'Contextly could not receive the thread.'))}window.addEventListener('message',listener);const thread=current();window.postMessage({type:'CONTEXTLY_RECEIVER_REQUEST',requestId,shareId,title:thread.title,content:thread.content,destination},location.origin)})}
async function sendToExtension(destination){setMessage('');if(!current().title||!current().content)return setMessage('The thread name and content are required.',true);try{status.textContent=destination?'Saving and opening the destination…':'Saving to Contextly…';await askExtension(destination);status.textContent=destination?'Saved to Contextly and inserted as an editable draft.':'Saved to your Contextly library.';setMessage(status.textContent)}catch(reason){status.textContent='Shared checkpoint · Edit or continue when ready';setMessage(reason instanceof Error?reason.message:String(reason),true)}}
(async()=>{try{const key=location.hash.slice(1);if(!shareId||!key)throw new Error('This private link is incomplete.');const response=await fetch(api+'?id='+encodeURIComponent(shareId)+'&format=json');const body=await response.json();if(!response.ok)throw new Error(body.error||'This private link is unavailable.');const bytes=decode(body.payload),cryptoKey=await crypto.subtle.importKey('raw',decode(key),'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},cryptoKey,bytes.slice(12));const thread=JSON.parse(new TextDecoder().decode(plain));heading.textContent='Shared thread';status.textContent='Shared checkpoint · Edit or continue when ready';title.value=thread.title;content.value=thread.content;viewer.hidden=false;document.querySelector('#save').onclick=()=>sendToExtension();document.querySelector('#chatgpt').onclick=()=>sendToExtension('chatgpt');document.querySelector('#claude').onclick=()=>sendToExtension('claude');document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(content.value);setMessage('Edited thread copied.')};document.querySelector('#download').onclick=()=>{const now=new Date().toISOString(),thread=current(),portable={format:'contextly-thread',version:1,thread:{id:crypto.randomUUID(),title:thread.title,content:thread.content,createdAt:now,updatedAt:now,source:'imported'}};const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(portable,null,2)],{type:'application/json'}));link.download=(thread.title.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'contextly-thread')+'.contextly.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}}catch(reason){heading.textContent='Thread unavailable';status.textContent='';setMessage(reason instanceof Error?reason.message:String(reason),true)}})();
</script></body></html>
